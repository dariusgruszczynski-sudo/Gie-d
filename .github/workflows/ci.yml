name: CI

# Uruchamia testy + lint na każdy push i PR do gałęzi deployowej/domyślnej.
# Dotąd NIC nie pilnowało jakości — zły commit wchodził na żywą kasę niezauważony
# aż do deployu. Teraz backend (ruff + pytest) i frontend (eslint + vitest +
# build) muszą przejść, a osobny skan sekretów łapie przypadkowo wrzucony klucz.

on:
  push:
    branches: ["claude/automated-stock-trading-app-ulacio", "main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Testy (pytest)
        run: pytest -q

  frontend:
    name: Frontend — eslint + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instaluj zależności
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Testy (vitest)
        run: npm test
      - name: Build
        run: npm run build

  secrets:
    name: Skan sekretów (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          VER=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
