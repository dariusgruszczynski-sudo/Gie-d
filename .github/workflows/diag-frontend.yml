name: Diag frontend
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Curl prod static
        run: |
          set +e
          BASE=https://46.225.229.113.sslip.io
          echo "===== GET / (nagłówki) ====="
          curl -sS -m 30 -D - -o index.html "$BASE/" -w '\nHTTP=%{http_code}\n'
          echo "===== watchdog + asset ref ====="
          grep -c "gd-selfheal" index.html && echo "WATCHDOG_PRESENT" || echo "WATCHDOG_ABSENT"
          ASSET=$(grep -oE '/assets/[^"]+\.js' index.html | head -1)
          echo "ASSET=$ASSET"
          echo "===== GET asset (status + nagłówki) ====="
          curl -sS -m 30 -I "$BASE$ASSET" -w '\nHTTP=%{http_code}\n'
          echo "===== GET /sw.js (wersja + cache) ====="
          curl -sS -m 30 -D - -o sw.js "$BASE/sw.js" -w '\nHTTP=%{http_code}\n'
          grep -oE 'gield-v[0-9]+' sw.js | head -1
          echo "===== GET /index.html cache nagłówki ====="
          curl -sS -m 30 -I "$BASE/index.html" | grep -iE 'cache-control|etag|last-modified|content-type' || true
          echo "===== pierwsze 25 linii serwowanego index.html ====="
          head -25 index.html
